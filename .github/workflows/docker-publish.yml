name: Build and publish container image

# Pushes to main/master build the image and publish it to GitHub Container
# Registry (GHCR) as ghcr.io/<owner>/<repo>:latest (plus branch, tag and sha
# tags). Portainer then simply pulls that image.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Smoke test: make sure the image actually builds and boots (pull requests).
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Build & health-check image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ps-form-designer:ci
          cache-from: type=gha

      - name: Run container and wait for /healthz/
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-test-key \
            -e DJANGO_ALLOWED_HOSTS='*' \
            ps-form-designer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz/; then
              echo "Healthcheck OK"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs smoke
          exit 1

      - name: Show logs
        if: always()
        run: docker logs smoke || true

  # ---------------------------------------------------------------------------
  # Publish: multi-arch image to GHCR (skipped for pull requests).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
